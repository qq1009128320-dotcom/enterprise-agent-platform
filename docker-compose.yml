version: '3.8'

services:
  streamlit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./demo:/app/demo
    environment:
      - PYTHONUNBUFFERED=1
      - MEMORY_ENGINE_MCP_HOST=host.docker.internal
      - MEMORY_ENGINE_MCP_PORT=8765
    command: streamlit run demo/app.py --server.address=0.0.0.0
